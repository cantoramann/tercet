name: release

# Publishes packages/tercet when a version tag (v0.5.0, ...) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub, and
# every release carries a provenance attestation linking it to this workflow.
# One-time setup on npmjs.com: package settings → Trusted publishing →
# GitHub Actions, repository cantoramann/tercet, workflow release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Trusted publishing needs npm 11.5.1+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Tag matches package version
        run: test "v$(node -p "require('./packages/tercet/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish
        working-directory: packages/tercet
        run: npm publish --provenance --access public
